services:
  web:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
    container_name: blog_web
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bloguser
      DB_PASS: blogpass
      DB_NAME: blog
      APP_ADMIN_USER: admin
      APP_ADMIN_PASS: admin123
    volumes:
      - ./:/var/www/html

  mysql:
    image: mysql:8.0
    container_name: blog_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blog
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: blogpass
      TZ: Europe/Paris
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
